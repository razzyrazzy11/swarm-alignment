name: Report integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  report-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r paper/requirements.txt
      - run: python paper/build.py
      - run: python paper/verify.py
