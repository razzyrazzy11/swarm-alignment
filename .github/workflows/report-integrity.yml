name: Report integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  report-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r paper/requirements.txt
      - run: python paper/verify.py
      - run: python -O paper/verify.py
      - run: python -m unittest discover -s paper/tests -v
      - run: python -m unittest discover -s experiments/tests -v
      - name: Verify prospective stateful freeze when present
        run: |
          if [ -f research/stateful-main-v2-freeze.json ]; then
            python -m experiments.stateful_study verify-freeze
          fi
      - name: Verify HF and continuation registrations
        run: |
          python -m experiments.hf_stateful verify-freeze
          python -m experiments.stateful_continue verify
      - name: Replay published evidence and statistical results
        run: |
          python -m experiments.verify_release
          python -m experiments.stateful_release verify
          python -m experiments.verify_stateful_results
      - name: Verify live and weight registrations and public releases
        run: |
          python -m experiments.live_study verify
          python -m experiments.live_continue verify
          python -m experiments.weight_study verify
          python -m experiments.weight_study replay
          if [ -f research/live-results.json ]; then
            python -m experiments.live_analysis verify
          fi
      - name: Reproduce separately labeled exploratory diagnostic
        run: python analysis/exploratory_restoration.py --check research/restoration-diagnostic-posthoc.json
