name: Report integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  report-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r paper/requirements.txt
      - run: python paper/verify.py
      - run: python -O paper/verify.py
      - run: python -m unittest discover -s paper/tests -v
      - run: python -m unittest discover -s experiments/tests -v
      - name: Verify prospective stateful freeze when present
        run: |
          if [ -f research/stateful-main-v2-freeze.json ]; then
            python -m experiments.stateful_study verify-freeze
          fi
      - name: Verify HF and continuation registrations
        run: |
          python -m experiments.hf_stateful verify-freeze
          python -m experiments.stateful_continue verify
      - name: Replay published evidence and statistical results
        run: |
          python -m experiments.verify_release
          python -m experiments.stateful_release verify
          python -m experiments.verify_stateful_results
      - name: Verify live and weight registrations and public releases
        run: |
          python -m experiments.live_study verify
          python -m experiments.live_continue verify
          python -m experiments.weight_study verify
          python -m experiments.weight_study replay
          if [ -f research/live-results.json ]; then
            python -m experiments.live_analysis verify
          fi
      - name: Reproduce separately labeled exploratory diagnostic
        run: python analysis/exploratory_restoration.py --check research/restoration-diagnostic-posthoc.json
      - name: Reproduce descriptive posthoc calibration breakdown
        run: |
          if [ -f analysis/calibration-breakdown-posthoc.json ]; then
            python analysis/calibration_breakdown.py --check analysis/calibration-breakdown-posthoc.json
          fi
      - name: Verify factorial registration and replay released evidence
        run: |
          if [ -f research/factorial-results.json ]; then
            python -m experiments.factorial_study verify
            python -m experiments.factorial_analysis verify
          fi
      - name: Verify separately registered rate continuation
        run: |
          if [ -f research/factorial-rate-continuation.json ]; then
            python -m experiments.factorial_continue verify --registration research/factorial-rate-continuation.json
          fi
      - name: Verify isolated serving diagnostic registration
        run: |
          if [ -f research/hf-diagnostic-freeze.json ]; then
            python -m experiments.hf_diagnostic verify
          fi
      - name: Verify workload capacity registration and public receipts
        run: |
          if [ -f research/hf-capacity-freeze.json ]; then
            python -m experiments.hf_capacity verify
          fi
          if [ -f research/hf-capacity-results.json ]; then
            python -m experiments.hf_capacity verify-results
          fi
          if [ -f research/hf-capacity-v2-freeze.json ]; then
            python -m experiments.hf_capacity_v2 verify
          fi
          if [ -f research/hf-capacity-v2-results.json ]; then
            python -m experiments.hf_capacity_v2 verify-results
          fi
      - name: Verify conditional final pacing registration
        run: |
          if [ -f research/factorial-paced-continuation.json ]; then
            python -m experiments.factorial_paced verify --registration research/factorial-paced-continuation.json
          fi
      - name: Verify separately registered Ollama readers
        run: |
          if [ -f research/ollama-reader-v1-freeze.json ]; then
            python -m experiments.ollama_study verify
          fi
      - name: Verify amended reporting and replay its public release
        run: |
          if [ -f research/factorial-reporting-freeze.json ]; then
            python -m experiments.factorial_reporting verify-registration
          fi
          if [ -f research/factorial-report.json ]; then
            python -m experiments.factorial_reporting verify
          fi
      - name: Verify original HF completion registrations
        run: |
          if [ -f research/hf-completion-v1-freeze.json ]; then
            python -m experiments.hf_completion verify
          fi
          if [ -f research/hf-completed-original-analysis-freeze.json ]; then
            python -m experiments.hf_completion_analysis verify-registration
          fi
          if [ -f research/hf-completion-v2-freeze.json ]; then
            python -m experiments.hf_completion_v2 verify
          fi
          if [ -f research/hf-completed-original-results.json ]; then
            python -m experiments.hf_completion_analysis verify
          fi
      - name: Verify separately registered five-agent study
        run: |
          for split in technical development main; do
            if [ -f "research/swarm-ledger-v1-$split-freeze.json" ]; then
              python -m experiments.swarm_ledger_study verify --split "$split"
            fi
          done
      - name: Verify prospective scheduling registrations
        run: |
          for split in pilot main; do
            if [ -f "research/swarm-ledger-dispatch-v1-$split-freeze.json" ]; then
              python -m experiments.swarm_ledger_dispatch verify --split "$split"
            fi
          done
